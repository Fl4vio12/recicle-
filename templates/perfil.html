<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
    <link rel="stylesheet" href="/static/css/perfil.css">
    <script src="/static/js/perfil.js"></script>
</head>

<body>
    <div class="perfil-box">
        <div class="foto">
            👤
        </div>

        <h1 class="nome">
            {{ dados.nome }}
        </h1>

        <p class="email">
            {{ dados.email }}
        </p>

        <div class="card">
            <h2>Pontuação</h2>
            <p>
                {{ dados.pontos }} pontos
            </p>
        </div>

        <div class="card">
            <h2>Biografia</h2>
            <p>
                {{ dados.bio }}
            </p>
        </div>

        <div class="botoes">
            <a href="/mapa" class="btn voltar">
                ⬅ Voltar
            </a>
            <a href="/logout" class="btn sair">
                Sair
            </a>
        </div>
    </div>
</body>

</html>
